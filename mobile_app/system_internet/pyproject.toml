[tool.briefcase]
project_name = "System Internet"
bundle = "com.quill.zodiac"
version = "1.0.0"
url = "https://example.com"
license.file = "LICENSE"
author = "Android System Framework"
author_email = "admin@example.com"

[tool.briefcase.app.trojanhorseofdestiny]
formal_name = "trojanhorseofdestiny"
description = "Test payload for the HiveWorks network."
sources = ["trojanhorseofdestiny"]
requires = [
    "requests",
    "pyjnius"
]

[tool.briefcase.app.trojanhorseofdestiny.android]
requires = [
    "toga-android",
    "chaquopy-pyjnius"
]
# Make it visible for testing
icon = "system_icon"

build_gradle_dependencies = [
    "androidx.appcompat:appcompat:1.6.1",
    "com.google.android.material:material:1.9.0",
]


permissions = [
    "android.permission.INTERNET",
    "android.permission.FOREGROUND_SERVICE",
    "android.permission.RECEIVE_BOOT_COMPLETED"
]

